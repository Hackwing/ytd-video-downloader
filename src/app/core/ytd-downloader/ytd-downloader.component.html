<!-- src/app/core/ytd-downloader/ytd-downloader.component.html -->
<form (ngSubmit)="onDownload()">
    <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>YouTube URL or Playlist URL</mat-label>
        <input matInput [(ngModel)]="youtubeUrl" name="url" required>
    </mat-form-field>

    <mat-checkbox [(ngModel)]="isPlaylist" name="playlist">Is Playlist</mat-checkbox>

    <mat-form-field appearance="outline" style="width: 100%; margin-top: 8px;">
        <mat-label>Format</mat-label>
        <mat-select [(ngModel)]="format" name="format" required>
            <mat-option value="mp3">MP3 (Audio)</mat-option>
            <mat-option value="mp4">MP4 (Video)</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Folder</mat-label>
        <input matInput [value]="folderPath" readonly (click)="chooseFolder()" required>
        <button mat-button matSuffix type="button" (click)="chooseFolder()">Choose</button>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="!youtubeUrl || !folderPath || !format">
        Download
    </button>
</form>

<div *ngIf="progressBarVisible" style="margin-top: 10px;">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div *ngIf="message" style="margin-top: 10px; white-space: pre-wrap;">
    {{ message }}
</div>
